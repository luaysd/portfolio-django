version: '3.8'

services:
  web:
    build: .
    container_name: django_app
    command: "gunicorn portfolio.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    restart: always

volumes:
  static_volume:
